x-common-env: &common-env
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  LLM_MODEL: ${LLM_MODEL:-gpt-3.5-turbo}
  # 0.0, matching config.py and .env.example. This default was 1.0, so every
  # containerised deployment composed financial figures at full sampling
  # temperature while the code and the documented configuration both said
  # deterministic -- and the composer's job is to restate exact numbers.
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
  LANGFUSE_TRACING_ENABLED: ${LANGFUSE_ENABLED:-false}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
  LANGFUSE_REQUIRED: ${LANGFUSE_REQUIRED:-false}
  DATA_DIR: /app/data
  FINANCIAL_DATA_PATH: /app/data/financial_reports
  DATA_PROVIDER: ${DATA_PROVIDER:-financial_reports}
  FINANCIAL_REPORTS_BASE_URL: ${FINANCIAL_REPORTS_BASE_URL:-http://financial-reports:8010}
  FINANCIAL_REPORTS_TIMEOUT: ${FINANCIAL_REPORTS_TIMEOUT:-10}
  FINANCIAL_REPORTS_MAX_RETRIES: ${FINANCIAL_REPORTS_MAX_RETRIES:-2}
  DATA_CACHE_TTL_SECONDS: ${DATA_CACHE_TTL_SECONDS:-300}
  ALLOW_JSON_FALLBACK: ${ALLOW_JSON_FALLBACK:-false}
  MIN_DATA_QUALITY_SCORE: ${MIN_DATA_QUALITY_SCORE:-0.6}
  AUTO_REFRESH_MISSING_DATA: ${AUTO_REFRESH_MISSING_DATA:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # The default bridge sets MTU 1500 while this host's uplink (eth0) is
      # 1280, so large downloads stall mid-transfer during builds -- observed
      # as wheels cut off after ~1MB and "Connection reset by peer". Building
      # on the host network uses the correct MTU.
      network: host
    image: financial-agent:latest
    container_name: financial-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_BASE_URL: http://api:8000
      API_RELOAD: "false"
      # The containerised workbench proxies through nginx and is same-origin;
      # only the Vite dev server needs an entry here.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      # Both of these run in their own compose projects and publish on the host.
      # Joining their networks would make them required: an external network that
      # does not exist stops `docker compose up` before any container starts.
      - "financial-reports:host-gateway"
      - "langfuse-web:host-gateway"
    networks:
      - financial-agent-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # `npm ci` downloads too; same MTU reasoning as the API build above.
      network: host
    # Pinned rather than left to compose's project-name default, which is
    # `financial_agent-web` -- an underscore where every other name here uses a
    # hyphen, and a name you cannot guess when tagging an image by hand.
    image: financial-agent-web:latest
    container_name: financial-agent-web
    restart: unless-stopped
    ports:
      # Loopback only: the workbench is a local research tool, not a public site.
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 first and nginx binds IPv4 only, so "localhost" is refused and the
      # container reports unhealthy while serving fine from the host.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - financial-agent-network

networks:
  financial-agent-network:
    driver: bridge
