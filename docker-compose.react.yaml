# Local React workbench; the legacy Streamlit service is not started.
# docker compose -f docker-compose.yaml -f docker-compose.react.yaml up --build web
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - financial-agent-network
    restart: unless-stopped
