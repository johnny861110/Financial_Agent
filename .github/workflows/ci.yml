name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --frozen keeps CI pinned to uv.lock so a gate never passes against a
      # silently-resolved different dependency set than the one developers ran.
      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # test_producer_smoke.py fails collection when no producer is reachable,
      # and none runs here. The cross-repo smoke workflow runs those tests
      # against a real producer build with SMOKE_REQUIRE_DATA set, so skipping
      # them in this job loses no coverage.
      - name: Tests
        run: uv run pytest -q
        env:
          FA_ALLOW_SMOKE_SKIP: "1"

      - name: Type check (mypy)
        run: >
          uv run mypy
          app/data app/agents app/api app/services
          app/models/agent_models.py app/models/api_models.py
          evaluation

      - name: Format check (black)
        run: uv run black --check app tests evaluation scripts

      - name: Byte-compile
        run: uv run python -m compileall -q app tests evaluation scripts

  frontend:
    name: React workbench and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Install backend for schema export
        run: uv sync --frozen
      - name: Export OpenAPI without external services
        run: uv run python scripts/export_openapi.py
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Verify generated API types
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api.generated.ts
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Interaction tests
        working-directory: frontend
        run: npm test

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      # Fails with a useful message when pyproject.toml and uv.lock disagree,
      # so dependency drift is caught at review time rather than at deploy.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
