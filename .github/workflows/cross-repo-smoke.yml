name: Cross-repo smoke

# Every other test mocks the producer, which only proves the consumer handles
# the shape it expects. This starts a real FinancialReports build and talks to
# it over HTTP, so a producer contract change fails here rather than in
# production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The producer can break the contract without this repository changing, so
  # also run on a schedule rather than only on our own commits.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: financial
          POSTGRES_DB: financial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial -d financial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FR_DATABASE_URL: postgresql+psycopg://financial:financial@localhost:5432/financial
      FINANCIAL_REPORTS_BASE_URL: http://127.0.0.1:8010

    steps:
      - name: Check out the consumer
        uses: actions/checkout@v4

      - name: Check out the producer
        uses: actions/checkout@v4
        with:
          repository: johnny861110/FinancialReports
          path: producer

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the producer
        working-directory: producer
        run: uv sync --frozen

      # Without a filing the contract tests that matter -- retrieval and the
      # snapshot round-trip -- skip, and the job proves almost nothing. This
      # seeds one ready filing with facts, a section and chunks, using the
      # producer's own store so the schema stays the producer's business.
      - name: Seed one filing
        working-directory: producer
        run: |
          uv run python - <<'PY'
          from src.domain.identity import FilingIdentity
          from src.domain.models import Fact
          from src.storage.store import FilingStore

          store = FilingStore()
          identity = FilingIdentity(stock_code="2330", year=2025, quarter="Q1")
          company_id = store.upsert_company("2330", name_zh="台積電")
          filing_id = store.upsert_filing(identity, company_id)
          store.save_facts_bulk(filing_id, [
              Fact(filing_key=identity.filing_key, field="net_revenue",
                   value=1000.0, source_type="xbrl", xbrl_tag="Revenue"),
              Fact(filing_key=identity.filing_key, field="eps_basic", value=2.5,
                   unit="TWD_per_share", source_type="xbrl", xbrl_tag="EPS"),
          ])
          doc_id = store.save_source_doc(
              filing_id, "pdf", "/tmp/seed.pdf", "https://example.com/seed.pdf", 1
          )
          section_id = store.save_section(doc_id, "risk", "風險因素", 1, 2, "風險章節")
          store.save_chunk(doc_id, section_id, 1, 0, "本公司面臨利率與匯率風險。",
                           importance_score=0.9)
          store.update_filing_status(filing_id, "insight_ready")
          print("seeded", identity.filing_key)
          PY

      - name: Start the producer
        working-directory: producer
        run: |
          # setsid detaches the server from this step's process group. Without
          # it the runner waits on the lingering child during post-job cleanup
          # and the job fails minutes after the tests have already passed.
          setsid nohup uv run uvicorn src.api.app:create_app --factory \
            --host 127.0.0.1 --port 8010 </dev/null > producer.log 2>&1 &
          echo $! > producer.pid
          for _ in $(seq 1 60); do
            if curl -sf "$FINANCIAL_REPORTS_BASE_URL/health/ready" >/dev/null; then
              echo "producer ready"; exit 0
            fi
            sleep 2
          done
          echo "producer failed to become ready"; cat producer.log; exit 1

      - name: Install the consumer
        run: uv sync --extra dev --frozen

      # A skipped smoke test looks identical to a passing one, which is the
      # failure mode this job exists to avoid, so skips are errors here.
      - name: Smoke test the contract
        run: uv run pytest tests/test_producer_smoke.py -v --no-header -rs -W error::pytest.PytestUnraisableExceptionWarning
        env:
          SMOKE_REQUIRE_DATA: "1"

      - name: Producer log on failure
        if: failure()
        working-directory: producer
        run: cat producer.log || true

      - name: Stop the producer
        if: always()
        working-directory: producer
        run: |
          [ -f producer.pid ] && kill "$(cat producer.pid)" 2>/dev/null || true
          pkill -f "uvicorn src.api.app" 2>/dev/null || true
          exit 0
